version: 2.1

jobs:

  hello-circleci:

    machine:
      image: ubuntu-2204:current

    steps:

      # Download our repository.
      - checkout


      # Run a simple command to prove that
      # our CircleCI pipeline is working.
      - run:
          name: Test CircleCI
          command: |
            echo "Hello from CircleCI"
            echo "Our CI pipeline is working"


workflows:

  demo-workflow:

    jobs:
      - hello-circleci